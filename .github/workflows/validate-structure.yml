name: Build and Test

on:
  push:
    branches:
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RaceDayManagementAPI/RaceDayManagementAPI.sln

      - name: Build solution
        run: dotnet build RaceDayManagementAPI/RaceDayManagementAPI.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDayManagementAPI/RaceDayManagementAPI.sln --configuration Release --no-build --verbosity normal
